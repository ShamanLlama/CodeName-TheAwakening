<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>{{{ PRODUCT_NAME }}}</title>
		<style>
/* The loading screen is the game's title page: a lamp-lit desk, the title in print, and a
   brass rule that fills as the archive downloads. Unity's loader logic is unchanged. */
:root {
	--desk: #0d0b08;
	--lamp: #ebdfc2;
	--lamp-dim: #a39278;
	--brass: #bf9a55;
	--danger: #d9483b;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--lamp);
	background-color: var(--desk);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	width: 100vw;
	height: 100vh;
	background: var(--desk);
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse at 46% 46%, #1c1711 0%, var(--desk) 70%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: flex-start;
	padding: max(24px, env(safe-area-inset-top)) max(8vw, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(8vw, env(safe-area-inset-left));
	box-sizing: border-box;
	visibility: hidden;
	font-family: Georgia, 'Times New Roman', serif;
}

.kicker, .reading, .hint, #status-notice {
	font-family: 'Courier New', Courier, monospace;
	font-weight: bold;
	letter-spacing: 0.08em;
	text-transform: uppercase;
}

.kicker {
	color: var(--brass);
	font-size: clamp(11px, 1.6vw, 14px);
	margin: 0 0 0.6em;
}

h1 {
	margin: 0;
	font-weight: normal;
	line-height: 0.95;
	font-size: clamp(40px, 8.5vw, 112px);
	color: var(--lamp);
}

h1 em {
	display: block;
	color: var(--brass);
	font-size: 0.82em;
}

.rule {
	position: relative;
	width: min(420px, 70vw);
	height: 3px;
	margin: clamp(18px, 4vh, 36px) 0 12px;
	background: rgba(191, 154, 85, 0.22);
}

#status-fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 0;
	background: var(--brass);
	transition: width 0.25s linear;
}

.rule.waiting #status-fill {
	width: 100%;
	animation: breathe 1.6s ease-in-out infinite;
}

@keyframes breathe {
	50% { opacity: 0.45; }
}

@media (prefers-reduced-motion: reduce) {
	#status-fill { transition: none; }
	.rule.waiting #status-fill { animation: none; }
}

.reading {
	color: var(--lamp-dim);
	font-size: clamp(12px, 1.6vw, 14px);
	min-height: 1.4em;
}

.hint {
	color: var(--lamp-dim);
	opacity: 0;
	font-size: clamp(11px, 1.4vw, 12px);
	letter-spacing: 0.04em;
	text-transform: none;
	font-weight: normal;
	max-width: 46ch;
	line-height: 1.5;
	margin-top: 10px;
	transition: opacity 0.6s;
}

.hint.shown {
	opacity: 1;
}

#status-notice {
	display: none;
	color: var(--lamp);
	border-left: 3px solid var(--danger);
	padding: 0.6em 1em;
	margin-top: 16px;
	font-size: 13px;
	line-height: 1.5;
	text-transform: none;
	letter-spacing: 0.02em;
	max-width: 60ch;
}
		</style>
	</head>
	<body>
		<canvas id="canvas" tabindex="-1">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status" role="status" aria-live="polite">
			<p class="kicker">Being a chronicle of the years 1908 – 1926</p>
			<h1>The Awakening <em>of Cthulhu</em></h1>
			<div class="rule" id="status-rule"><div id="status-fill"></div></div>
			<div class="reading" id="status-reading">Opening the archive</div>
			<div class="hint" id="status-hint">The first visit downloads the whole game. Later visits open from your browser's cache.</div>
			<div id="status-notice"></div>
		</div>

		<script src="Build/{{{ LOADER_FILENAME }}}"></script>
		<script>
(function () {
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusRule = document.getElementById('status-rule');
	const statusFill = document.getElementById('status-fill');
	const statusReading = document.getElementById('status-reading');
	const statusHint = document.getElementById('status-hint');
	const statusNotice = document.getElementById('status-notice');
	statusOverlay.style.visibility = 'visible';

	// A slow first visit gets a word of explanation instead of a bar that seems stuck.
	const hintTimer = setTimeout(() => statusHint.classList.add('shown'), 8000);

	// Arrow keys and Space belong to the game, not to the page that embeds it.
	window.addEventListener('keydown', (e) => {
		if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) e.preventDefault();
	}, { passive: false });

	function fail(message) {
		console.error(message);
		clearTimeout(hintTimer);
		statusNotice.textContent = String(message);
		statusNotice.style.display = 'block';
		statusReading.textContent = 'The archive could not be opened';
		statusRule.classList.remove('waiting');
	}

	const config = {
		dataUrl: 'Build/{{{ DATA_FILENAME }}}',
		frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
		codeUrl: 'Build/{{{ CODE_FILENAME }}}',
		streamingAssetsUrl: 'StreamingAssets',
		companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
		productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
		productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
		showBanner: (message, type) => { if (type === 'error') fail(message); },
	};

	createUnityInstance(canvas, config, (progress) => {
		if (progress < 0.9) {
			const percent = Math.floor((progress / 0.9) * 100);
			statusRule.classList.remove('waiting');
			statusFill.style.width = percent + '%';
			statusReading.textContent = 'Opening the archive · ' + percent + '%';
		} else {
			// Downloaded; the browser now compiles the engine, which takes a moment on phones.
			statusRule.classList.add('waiting');
			statusReading.textContent = 'Unsealing the chart';
		}
	}).then(() => {
		clearTimeout(hintTimer);
		statusOverlay.remove();
		canvas.focus();
	}).catch(fail);
}());
		</script>
	</body>
</html>
