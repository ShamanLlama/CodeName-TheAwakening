<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
/* The loading screen is the game's title page: a lamp-lit desk, the title in print, and a
   brass rule that fills as the archive downloads. Godot's own loader logic is unchanged. */
:root {
	--desk: #0d0b08;
	--lamp: #ebdfc2;
	--lamp-dim: #a39278;
	--brass: #bf9a55;
	--danger: #d9483b;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--lamp);
	background-color: var(--desk);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background: radial-gradient(ellipse at 46% 46%, #1c1711 0%, var(--desk) 70%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: flex-start;
	padding: max(24px, env(safe-area-inset-top)) max(8vw, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(8vw, env(safe-area-inset-left));
	box-sizing: border-box;
	visibility: hidden;
	font-family: Georgia, 'Times New Roman', serif;
}

.kicker, .reading, .hint, #status-notice {
	font-family: 'Courier New', Courier, monospace;
	font-weight: bold;
	letter-spacing: 0.08em;
	text-transform: uppercase;
}

.kicker {
	color: var(--brass);
	font-size: clamp(11px, 1.6vw, 14px);
	margin: 0 0 0.6em;
}

h1 {
	margin: 0;
	font-weight: normal;
	line-height: 0.95;
	font-size: clamp(40px, 8.5vw, 112px);
	color: var(--lamp);
}

h1 em {
	display: block;
	color: var(--brass);
	font-size: 0.82em;
}

.rule {
	position: relative;
	width: min(420px, 70vw);
	height: 3px;
	margin: clamp(18px, 4vh, 36px) 0 12px;
	background: rgba(191, 154, 85, 0.22);
}

#status-fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 0;
	background: var(--brass);
	transition: width 0.25s linear;
}

.rule.waiting #status-fill {
	width: 100%;
	animation: breathe 1.6s ease-in-out infinite;
}

@keyframes breathe {
	50% { opacity: 0.45; }
}

@media (prefers-reduced-motion: reduce) {
	#status-fill { transition: none; }
	.rule.waiting #status-fill { animation: none; }
}

.reading {
	color: var(--lamp-dim);
	font-size: clamp(12px, 1.6vw, 14px);
	min-height: 1.4em;
}

.hint {
	color: var(--lamp-dim);
	opacity: 0;
	font-size: clamp(11px, 1.4vw, 12px);
	letter-spacing: 0.04em;
	text-transform: none;
	font-weight: normal;
	max-width: 46ch;
	line-height: 1.5;
	margin-top: 10px;
	transition: opacity 0.6s;
}

.hint.shown {
	opacity: 1;
}

#status-notice {
	display: none;
	color: var(--lamp);
	border-left: 3px solid var(--danger);
	padding: 0.6em 1em;
	margin-top: 16px;
	font-size: 13px;
	line-height: 1.5;
	text-transform: none;
	letter-spacing: 0.02em;
	max-width: 60ch;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status" role="status" aria-live="polite">
			<p class="kicker">Being a chronicle of the years 1908 – 1926</p>
			<h1>The Awakening <em>of Cthulhu</em></h1>
			<div class="rule" id="status-rule"><div id="status-fill"></div></div>
			<div class="reading" id="status-reading">Opening the archive</div>
			<div class="hint" id="status-hint">The first visit downloads the whole game. Later visits open from your browser's cache.</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusRule = document.getElementById('status-rule');
	const statusFill = document.getElementById('status-fill');
	const statusReading = document.getElementById('status-reading');
	const statusHint = document.getElementById('status-hint');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	// A slow first visit gets a word of explanation instead of a bar that seems stuck.
	const hintTimer = setTimeout(() => statusHint.classList.add('shown'), 8000);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearTimeout(hintTimer);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		statusReading.textContent = 'The archive could not be opened';
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0 && current < total) {
					const percent = Math.floor((current / total) * 100);
					statusRule.classList.remove('waiting');
					statusFill.style.width = percent + '%';
					statusReading.textContent = 'Opening the archive · ' + percent + '%';
				} else if (current > 0 && current >= total) {
					// Downloaded; the browser now compiles the engine, which takes a moment on phones.
					statusRule.classList.add('waiting');
					statusReading.textContent = 'Unsealing the chart';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
